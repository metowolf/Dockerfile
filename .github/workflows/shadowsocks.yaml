name: build shadowsocks images

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "shadowsocks/**"

jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set environment variables
        run: |
          GITHUB_USER="${{ github.repository_owner }}"
          VERSION=$(awk -F= '/^ARG VERSION=/{print $2; exit}' shadowsocks/Dockerfile)
          test -n "$VERSION"
          echo "GITHUB_USER=${GITHUB_USER,,}" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ env.GITHUB_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker build and push
        uses: docker/build-push-action@v5
        with:
          push: true
          context: ./shadowsocks
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ env.GITHUB_USER }}/shadowsocks:${{ env.VERSION }}
            ghcr.io/${{ env.GITHUB_USER }}/shadowsocks:latest
